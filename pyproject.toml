[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatnow"
version = "0.1.0"
description = "TagTime-style activity tracker with GitHub Projects and Google Calendar integration"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [
    {name = "WhatNow Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "PyGObject>=3.42.0",
    "requests>=2.28.0",
    "google-auth>=2.16.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.80.0",
    "sqlalchemy>=2.0.0",
    "keyring>=23.0.0",
    "cryptography>=38.0.0",
    "alembic>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
whatnow = "whatnow.__main__:main"

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-data]
whatnow = ["alembic.ini", "alembic/**/*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
