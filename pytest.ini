[pytest]
# Pytest configuration for WhatNow

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=whatnow
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Coverage options
[coverage:run]
source = whatnow
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[tool:pytest]
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_gtk: Tests that require GTK display

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
